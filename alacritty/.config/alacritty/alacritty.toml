# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#0f0d16"
foreground = "#e6e4cf"
[colors.normal]
black = "#0f0d16"
red = "#585599"
green = "#88799E"
yellow = "#12A8DE"
blue = "#50BAC9"
magenta = "#18D2F0"
cyan = "#A39AAA"
white = "#e6e4cf"
[colors.bright]
black = "#a19f90"
red = "#585599"
green = "#88799E"
yellow = "#12A8DE"
blue = "#50BAC9"
magenta = "#18D2F0"
cyan = "#A39AAA"
white = "#e6e4cf"
