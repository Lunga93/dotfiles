# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#0c090e"
foreground = "#e4dee5"
[colors.normal]
black = "#0c090e"
red = "#483762"
green = "#5B4E68"
yellow = "#877278"
blue = "#5D4C91"
magenta = "#926BAD"
cyan = "#B09DB8"
white = "#e4dee5"
[colors.bright]
black = "#9f9ba0"
red = "#483762"
green = "#5B4E68"
yellow = "#877278"
blue = "#5D4C91"
magenta = "#926BAD"
cyan = "#B09DB8"
white = "#e4dee5"
