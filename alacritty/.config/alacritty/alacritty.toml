# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#100a0d"
foreground = "#a5b9ad"
[colors.normal]
black = "#100a0d"
red = "#335349"
green = "#3A6759"
yellow = "#55604D"
blue = "#4A6D59"
magenta = "#4B7763"
cyan = "#57914C"
white = "#a5b9ad"
[colors.bright]
black = "#738179"
red = "#335349"
green = "#3A6759"
yellow = "#55604D"
blue = "#4A6D59"
magenta = "#4B7763"
cyan = "#57914C"
white = "#a5b9ad"
