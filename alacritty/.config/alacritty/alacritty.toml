# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#131a19"
foreground = "#f4e3c9"
[colors.normal]
black = "#131a19"
red = "#8F715F"
green = "#D4A960"
yellow = "#4D7096"
blue = "#877D80"
magenta = "#61A1D0"
cyan = "#B3AABC"
white = "#f4e3c9"
[colors.bright]
black = "#aa9e8c"
red = "#8F715F"
green = "#D4A960"
yellow = "#4D7096"
blue = "#877D80"
magenta = "#61A1D0"
cyan = "#B3AABC"
white = "#f4e3c9"
