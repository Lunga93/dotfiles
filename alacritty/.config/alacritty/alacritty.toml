# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#0E2A3B"
foreground = "#b3c8d0"
[colors.normal]
black = "#0E2A3B"
red = "#4C798E"
green = "#6D7A84"
yellow = "#50849B"
blue = "#6C8994"
magenta = "#578CA4"
cyan = "#6C99AB"
white = "#b3c8d0"
[colors.bright]
black = "#7d8c91"
red = "#4C798E"
green = "#6D7A84"
yellow = "#50849B"
blue = "#6C8994"
magenta = "#578CA4"
cyan = "#6C99AB"
white = "#b3c8d0"
