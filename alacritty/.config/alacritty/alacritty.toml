# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#020000"
foreground = "#f27e7e"
[colors.normal]
black = "#020000"
red = "#8D0000"
green = "#910000"
yellow = "#960000"
blue = "#A40000"
magenta = "#AE0000"
cyan = "#CE0202"
white = "#f27e7e"
[colors.bright]
black = "#a95858"
red = "#8D0000"
green = "#910000"
yellow = "#960000"
blue = "#A40000"
magenta = "#AE0000"
cyan = "#CE0202"
white = "#f27e7e"
