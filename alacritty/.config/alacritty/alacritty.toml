# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#092132"
foreground = "#becdde"
[colors.normal]
black = "#092132"
red = "#3D81BF"
green = "#6389B7"
yellow = "#5A90C8"
blue = "#6F99C8"
magenta = "#9B9BA9"
cyan = "#D1C3B3"
white = "#becdde"
[colors.bright]
black = "#858f9b"
red = "#3D81BF"
green = "#6389B7"
yellow = "#5A90C8"
blue = "#6F99C8"
magenta = "#9B9BA9"
cyan = "#D1C3B3"
white = "#becdde"
