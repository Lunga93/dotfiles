# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#131209"
foreground = "#d4dcd4"
[colors.normal]
black = "#131209"
red = "#168836"
green = "#638F23"
yellow = "#0A8D51"
blue = "#669553"
magenta = "#AFBD38"
cyan = "#62A5DB"
white = "#d4dcd4"
[colors.bright]
black = "#949a94"
red = "#168836"
green = "#638F23"
yellow = "#0A8D51"
blue = "#669553"
magenta = "#AFBD38"
cyan = "#62A5DB"
white = "#d4dcd4"
