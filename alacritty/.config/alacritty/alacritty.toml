# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#0f0a13"
foreground = "#acb9e7"
[colors.normal]
black = "#0f0a13"
red = "#2D64AF"
green = "#474E93"
yellow = "#4F5AAF"
blue = "#4439EB"
magenta = "#2F5ED8"
cyan = "#5567D8"
white = "#acb9e7"
[colors.bright]
black = "#7881a1"
red = "#2D64AF"
green = "#474E93"
yellow = "#4F5AAF"
blue = "#4439EB"
magenta = "#2F5ED8"
cyan = "#5567D8"
white = "#acb9e7"
