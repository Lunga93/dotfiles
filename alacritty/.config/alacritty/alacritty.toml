# Alacritty template (no colors block). apply-theme will append a single [colors] block.

[window]
dynamic_padding = true
decorations = "full"
opacity = 0.8

[font]
size = 12
normal = { family = "Noto Sans Mono", style = "Regular" }
bold = { family = "Noto Sans Mono", style = "Bold" }
italic = { family = "Noto Sans Mono", style = "Italic" }

[scrolling]
history = 10000

[general]
live_config_reload = true

# Colors block is intentionally omitted here. apply-theme writes it.

[colors.primary]
background = "#210000"
foreground = "#ebbfaa"
[colors.normal]
black = "#210000"
red = "#B24A22"
green = "#C1481D"
yellow = "#D15A22"
blue = "#D5704B"
magenta = "#E07853"
cyan = "#EC9734"
white = "#ebbfaa"
[colors.bright]
black = "#a48576"
red = "#B24A22"
green = "#C1481D"
yellow = "#D15A22"
blue = "#D5704B"
magenta = "#E07853"
cyan = "#EC9734"
white = "#ebbfaa"
